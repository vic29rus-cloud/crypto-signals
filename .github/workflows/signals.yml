name: Kraken Signal Scanner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим для ручного теста (scan / trigger / report)'
        required: false
        default: 'scan'
      period:
        description: 'Период отчёта, если mode=report (3d / month)'
        required: false
        default: '3d'
  schedule:
    # Полный скан (тренд 4h/1d/1w по всем парам + боковики) — раз в 3 часа
    - cron: '5 */3 * * *'
    # Быстрая проверка триггера входа/выхода — каждые 15 минут
    - cron: '*/15 * * * *'
    # Отчёт каждые 3 дня в 09:00 UTC
    - cron: '0 9 */3 * *'
    # Отчёт раз в месяц, 1 числа в 09:30 UTC
    - cron: '30 9 1 * *'

permissions:
  contents: write

# КРИТИЧНО: scan и trigger оба читают/пишут kraken_scanner_state.json. Без этой
# блокировки они могут выполниться одновременно и затереть данные друг друга —
# именно так "пропадали" открытые позиции без единого сообщения о продаже.
# Общая группа гарантирует: пока один job работает с состоянием, второй ждёт в очереди.
concurrency:
  group: kraken-state
  cancel-in-progress: false

jobs:
  scan:
    if: github.event.schedule == '5 */3 * * *' || github.event.inputs.mode == 'scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - name: Полный скан (confluence + боковики, обновление тренд-контекста)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kraken_signal_scanner.py --mode scan ${{ github.event_name == 'workflow_dispatch' && '--force-status' || '' }}
      - name: Сохранить состояние
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add kraken_scanner_state.json telegram_subscribers.json trades_log.json last_status_time.json scan_stats.json qualified_pairs.json
          if git diff --staged --quiet; then echo "Нечего сохранять"; exit 0; fi
          git commit -m "chore: update scanner state (full scan)"
          CRITICAL_FILES="kraken_scanner_state.json trades_log.json"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash; then
              if git push; then echo "Сохранено успешно (попытка $i)"; exit 0; fi
            else
              UNMERGED=$(git diff --name-only --diff-filter=U)
              echo "Конфликт в файлах: $UNMERGED"
              CRITICAL_HIT=0
              for f in $UNMERGED; do
                for cf in $CRITICAL_FILES; do
                  [ "$f" = "$cf" ] && CRITICAL_HIT=1
                done
              done
              if [ "$CRITICAL_HIT" = "1" ]; then
                echo "::error::Конфликт в торговых данных ($UNMERGED) — нужно ручное вмешательство"
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              # конфликт только в служебных файлах (статус/кэш/статистика) — берём свою свежую версию
              for f in $UNMERGED; do
                git checkout --ours -- "$f" 2>/dev/null || true
                git add "$f" 2>/dev/null || true
              done
              if git rebase --continue --no-edit && git push; then
                echo "Сохранено, конфликт авторазрешён (попытка $i)"; exit 0
              fi
            fi
            echo "Попытка $i не удалась, повтор..."
            git rebase --abort 2>/dev/null || true
            sleep $((5 + RANDOM % 10))
          done
          echo "::error::Не удалось сохранить состояние после 5 попыток — данные этого запуска ПОТЕРЯНЫ"
          exit 1

  trigger:
    if: github.event.schedule == '*/15 * * * *' || github.event.inputs.mode == 'trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - name: Быстрая проверка триггера (только квалифицированные пары + открытые позиции)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kraken_signal_scanner.py --mode trigger
      - name: Сохранить состояние
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add kraken_scanner_state.json telegram_subscribers.json trades_log.json scan_stats.json
          if git diff --staged --quiet; then echo "Нечего сохранять"; exit 0; fi
          git commit -m "chore: update scanner state (trigger)"
          CRITICAL_FILES="kraken_scanner_state.json trades_log.json"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash; then
              if git push; then echo "Сохранено успешно (попытка $i)"; exit 0; fi
            else
              UNMERGED=$(git diff --name-only --diff-filter=U)
              echo "Конфликт в файлах: $UNMERGED"
              CRITICAL_HIT=0
              for f in $UNMERGED; do
                for cf in $CRITICAL_FILES; do
                  [ "$f" = "$cf" ] && CRITICAL_HIT=1
                done
              done
              if [ "$CRITICAL_HIT" = "1" ]; then
                echo "::error::Конфликт в торговых данных ($UNMERGED) — нужно ручное вмешательство"
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              for f in $UNMERGED; do
                git checkout --ours -- "$f" 2>/dev/null || true
                git add "$f" 2>/dev/null || true
              done
              if git rebase --continue --no-edit && git push; then
                echo "Сохранено, конфликт авторазрешён (попытка $i)"; exit 0
              fi
            fi
            echo "Попытка $i не удалась, повтор..."
            git rebase --abort 2>/dev/null || true
            sleep $((5 + RANDOM % 10))
          done
          echo "::error::Не удалось сохранить состояние после 5 попыток — данные этого запуска ПОТЕРЯНЫ"
          exit 1

  report-3d:
    if: github.event.schedule == '0 9 */3 * *' || (github.event.inputs.mode == 'report' && github.event.inputs.period == '3d')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - name: Отчёт за 3 дня
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kraken_signal_scanner.py --mode report --period 3d
      - name: Сохранить состояние подписчиков
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add telegram_subscribers.json
          if git diff --staged --quiet; then echo "Нечего сохранять"; exit 0; fi
          git commit -m "chore: update subscribers (3d report)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "Сохранено успешно (попытка $i)"; exit 0
            fi
            echo "Попытка $i не удалась, повтор..."
            git rebase --abort 2>/dev/null || true
            sleep $((5 + RANDOM % 10))
          done
          echo "::error::Не удалось сохранить подписчиков после 5 попыток"
          exit 1

  report-monthly:
    if: github.event.schedule == '30 9 1 * *' || (github.event.inputs.mode == 'report' && github.event.inputs.period == 'month')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - name: Отчёт за месяц
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kraken_signal_scanner.py --mode report --period month
      - name: Сохранить состояние подписчиков
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add telegram_subscribers.json
          if git diff --staged --quiet; then echo "Нечего сохранять"; exit 0; fi
          git commit -m "chore: update subscribers (monthly report)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "Сохранено успешно (попытка $i)"; exit 0
            fi
            echo "Попытка $i не удалась, повтор..."
            git rebase --abort 2>/dev/null || true
            sleep $((5 + RANDOM % 10))
          done
          echo "::error::Не удалось сохранить подписчиков после 5 попыток"
          exit 1
